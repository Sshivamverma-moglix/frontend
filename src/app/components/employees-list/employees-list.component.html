<div class="employee-container">

  <!-- Header -->
  <div class="page-header">
    <div class="left">
      <h2> Employee Directory</h2>
    </div>

    <div class="right actions">
      <app-import></app-import>
      <app-download></app-download>
    </div>
  </div>

  <!-- Filters -->
  <mat-card class="filter-card mat-elevation-z4">
    <app-search-filter (filterChanged)="applyFilter($event)"></app-search-filter>
  </mat-card>

  <!-- Employee Table -->
  <mat-card class="table-card mat-elevation-z4">
    <h3 class="section-title">📋 Employee List</h3>

    <div class="table-wrapper">
      <table mat-table [dataSource]="data" class="employee-table" matSort>

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let emp">{{ emp.id }}</td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let emp">{{ emp.name }}</td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let emp">{{ emp.email }}</td>
        </ng-container>

        <!-- Designation -->
        <ng-container matColumnDef="designation">
          <th mat-header-cell *matHeaderCellDef>Designation</th>
          <td mat-cell *matCellDef="let emp">{{ emp.designation }}</td>
        </ng-container>

        <!-- Department -->
        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let emp">{{ emp.departmentName }}</td>
        </ng-container>

        <!-- Manager -->
        <ng-container matColumnDef="manager">
          <th mat-header-cell *matHeaderCellDef>Manager</th>
          <td mat-cell *matCellDef="let emp">{{ emp.managerName }}</td>
        </ng-container>

        <!-- Phone -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let emp">{{ emp.phone || 'N/A' }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let emp" class="actions-cell">
            <button
              mat-stroked-button
              color="warn"
              (click)="openDeleteDialog(emp.id, emp.name, $event)">
              Delete
            </button>

            <button
              mat-raised-button
              color="primary"
              [routerLink]="['/employees', emp.id]">
              Update
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <app-pagination
      (paginationEvent)="onPageChange($event)"
      [totalItems]="totalItems">
    </app-pagination>

    <p *ngIf="data.data.length === 0" class="no-data">No employees found.</p>
  </mat-card>

  <!-- Charts Section -->
  <div class="chart-section">
    <mat-card class="chart-card mat-elevation-z4">
      <app-new-chart
        [chartLabels]="barChartLabels"
        [chartDatasets]="barChartDatasets"
        [chartType]="charType"
        chartTitle="Employees Created Per Date"
        [responsive]="true">
      </app-new-chart>
    </mat-card>

    <mat-card class="chart-card mat-elevation-z4">
      <app-overview-dashboard></app-overview-dashboard>
    </mat-card>

    <mat-card class="chart-card mat-elevation-z4">
      <app-funnel-chart [funnelData]="funnelData$ | async" (segmentChanged)="onFunnelSegmentChange($event)"></app-funnel-chart>
    </mat-card>

  </div>
</div>
